name: hellboy-release

# Hellboy Prod releases use their own tag prefix so they never collide with the
# Python package releases that build.yml publishes on plain v* tags.
on:
  push:
    tags: ["hellboy-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: hellboy-prod

jobs:
  binaries:
    name: ${{ matrix.bridge }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: node20-macos-arm64
            bridge: hellboy-bridge-darwin-arm64
            installer: hellboy-installer-darwin-arm64
          - os: macos-15-intel
            target: node20-macos-x64
            bridge: hellboy-bridge-darwin-x64
            installer: hellboy-installer-darwin-x64
          - os: windows-latest
            target: node20-win-x64
            bridge: hellboy-bridge-win-x64.exe
            installer: hellboy-installer-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hellboy-prod/package-lock.json

      - run: npm ci
      - run: npm run bundle

      - name: Compile bridge
        run: npx pkg bridge/build/bridge.cjs --targets ${{ matrix.target }} --output dist/${{ matrix.bridge }}

      - name: Compile installer
        run: npx pkg installer/build/installer.cjs --targets ${{ matrix.target }} --output dist/${{ matrix.installer }}

      - name: Ad-hoc codesign
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/${{ matrix.bridge }}
          codesign --force --sign - dist/${{ matrix.installer }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bridge }}
          path: hellboy-prod/dist/${{ matrix.bridge }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer }}
          path: hellboy-prod/dist/${{ matrix.installer }}
          if-no-files-found: error

  publish:
    name: publish
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: hellboy-prod/artifacts

      - name: Collect and package
        run: |
          mkdir -p dist hellboyprod-remote-script
          find artifacts -type f -exec cp {} dist/ \;
          cp -r remote-script/HellboyProd hellboyprod-remote-script/
          zip -r dist/hellboyprod-remote-script.zip hellboyprod-remote-script
          cd dist && sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: hellboy-prod/dist/*
          generate_release_notes: true

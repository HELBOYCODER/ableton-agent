name: hellboy-release

# Hellboy Prod releases use their own tag prefix so they never collide with the
# Python package releases that build.yml publishes on plain v* tags.
on:
  push:
    tags: ["hellboy-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: hellboy-prod
    shell: bash

jobs:
  binaries:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: node20-macos-arm64
            platform: darwin-arm64
            arch: arm64
          - os: macos-15-intel
            target: node20-macos-x64
            platform: darwin-x64
            arch: x64
          - os: windows-latest
            target: node20-win-x64
            platform: win-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hellboy-prod/package-lock.json

      - run: npm ci
      - run: npm run bundle

      - name: Fetch pkg base binaries (checksum-verified, never build Node from source)
        run: node app/scripts/pkg-prefetch.mjs ${{ matrix.target }}

      - name: Compile bridge, installer and Hellboy Studio
        run: |
          npx pkg bridge/build/bridge.cjs --targets ${{ matrix.target }} --output dist/hellboy-bridge-${{ matrix.platform }}${{ matrix.ext }}
          npx pkg installer/build/installer.cjs --targets ${{ matrix.target }} --output dist/hellboy-installer-${{ matrix.platform }}${{ matrix.ext }}
          npx pkg app/build/app.cjs --targets ${{ matrix.target }} --output dist/hellboy-studio-${{ matrix.platform }}${{ matrix.ext }}

      - name: Windows - no console window for Hellboy Studio
        if: runner.os == 'Windows'
        run: node app/scripts/win-gui.mjs dist/hellboy-studio-${{ matrix.platform }}.exe

      - name: macOS - sign the binaries
        if: runner.os == 'macOS'
        run: |
          for f in bridge installer studio; do codesign --force --sign - dist/hellboy-$f-${{ matrix.platform }}; done

      - name: Smoke test the compiled Studio
        run: |
          npm run build -w mock-live
          HELLBOY_APP_BIN=dist/hellboy-studio-${{ matrix.platform }}${{ matrix.ext }} node --test app/test/app.test.js

      - name: macOS - build Hellboy Studio.app
        if: runner.os == 'macOS'
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          node app/scripts/mac-app.mjs dist/hellboy-studio-${{ matrix.platform }} dist/app "$VERSION"
          codesign --force --deep --sign - "dist/app/Hellboy Studio.app"
          ditto -c -k --keepParent "dist/app/Hellboy Studio.app" dist/HellboyStudio-macOS-${{ matrix.arch }}.zip
          rm -rf dist/app dist/hellboy-studio-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: hellboy-${{ matrix.platform }}
          path: hellboy-prod/dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: hellboy-prod/artifacts

      - name: Release tag
        id: tag
        # a tag push uses that tag; a manual run tags this commit with the
        # version in hellboy-prod/package.json
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=hellboy-v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and package
        run: |
          mkdir -p dist hellboyprod-remote-script
          find artifacts -type f -exec cp {} dist/ \;
          cp -r remote-script/HellboyProd hellboyprod-remote-script/
          zip -r dist/hellboyprod-remote-script.zip hellboyprod-remote-script
          cd dist && sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Hellboy Prod ${{ steps.tag.outputs.name }}
          files: hellboy-prod/dist/*
          generate_release_notes: true
